[project]
name = "flsubtitles-aligner"
version = "0.1.0"
description = "Word timings of the subtitle text in its audio (Qwen3-ForcedAligner via qwen-asr, CUDA); own environment: qwen-asr pins transformers 4.57"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "qwen-asr==0.0.6",
    "numpy",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
