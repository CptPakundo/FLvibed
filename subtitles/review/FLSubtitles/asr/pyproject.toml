[project]
name = "flsubtitles-asr"
version = "0.1.0"
description = "Speech-to-text for FLSubtitles (Qwen3-ASR via Transformers, CUDA)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.1",
    "transformers>=5.20",
    "accelerate",
    "soundfile",
    "numpy",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
